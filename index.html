<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivekananda Atlas</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="map">
        <div id="timeline-container">
            <div id="ruler">
                <div class="tick" style="left: 0%;"><span>1863</span></div>
                <div class="tick" style="left: 25%;"><span>1873</span></div>
                <div class="tick" style="left: 50%;"><span>1883</span></div>
                <div class="tick" style="left: 75%;"><span>1893</span></div>
                <div class="tick" style="left: 100%;"><span>1902</span></div>
                <div id="year-indicator"></div>
            </div>
        </div>
    </div>

    <div id="sidebar">
        <button id="close-btn" onclick="closeSidebar()">×</button>
        <div id="sidebar-content">
            <h1 id="sidebar-title">Title</h1>
            <h4 id="sidebar-date">Date | Location</h4>
            <div id="sidebar-body">Loading...</div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/map.js"></script>

    <script>
        function closeSidebar() {
            document.body.classList.remove('sidebar-open');
            document.getElementById('sidebar').classList.remove('active');
            
            // Wait for CSS transition (0.35s) then fix the map
            setTimeout(() => {
                if (window.map) {
                    window.map.invalidateSize();
                }
            }, 360);
        }
    </script>
</body>
</html>
