<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivekananda Atlas</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="map">
        <div id="timeline-container">
            <div id="ruler">
                <div class="tick major" style="left: 0%;"><span>1863</span></div>
                <div class="tick minor" style="left: 5%;"></div>
                <div class="tick major" style="left: 10%;"><span>1867</span></div>
                <div class="tick minor" style="left: 15%;"></div>
                <div class="tick major" style="left: 20%;"><span>1871</span></div>
                
                <div class="tick minor" style="left: 25%;"></div> 
                <div class="tick major" style="left: 30%;"><span>1875</span></div>
                <div class="tick minor" style="left: 35%;"></div>
                <div class="tick major" style="left: 40%;"><span>1879</span></div>
                <div class="tick minor" style="left: 45%;"></div>
                
                <div class="tick major" style="left: 50%;"><span>1883</span></div>
                <div class="tick minor" style="left: 55%;"></div>
                <div class="tick major" style="left: 60%;"><span>1887</span></div>
                <div class="tick minor" style="left: 65%;"></div>
                <div class="tick major" style="left: 70%;"><span>1891</span></div>
                
                <div class="tick minor" style="left: 75%;"></div>
                <div class="tick major" style="left: 80%;"><span>1895</span></div>
                <div class="tick minor" style="left: 85%;"></div>
                <div class="tick major" style="left: 90%;"><span>1899</span></div>
                <div class="tick minor" style="left: 95%;"></div>
                <div class="tick major" style="left: 100%;"><span>1902</span></div>
                
                <div id="year-indicator"></div>
            </div>
        </div>
    </div>

    <div id="sidebar">
        <button id="close-btn" onclick="closeSidebar()">×</button>
        <div id="sidebar-content">
            <h1 id="sidebar-title">Title</h1>
            <h4 id="sidebar-date">Date | Location</h4>
            <div id="sidebar-body">Loading...</div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/timeline.js"></script>
    <script src="js/map.js"></script>

    <script>
        function closeSidebar() {
            document.body.classList.remove('sidebar-open');
            document.getElementById('sidebar').classList.remove('active');
            
            // Wait for CSS transition (0.35s) then fix the map
            setTimeout(() => {
                if (window.map) {
                    window.map.invalidateSize();
                }
            }, 360);
        }
    </script>
</body>
</html>
